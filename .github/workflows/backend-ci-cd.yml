name: Backend CI/CD

on:
  push:
    branches: [feature/full-stack]
    paths:
      - 'Server/**'
  pull_request:
    branches: [feature/full-stack]
    paths:
      - 'Server/**'

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: starttech-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Install dependencies
        working-directory: Server/MuchToDo
        run: go mod download

      - name: Run unit tests
        working-directory: Server/MuchToDo
        run: go test -v ./...

      - name: Run integration tests
        working-directory: Server/MuchToDo
        run: go test -tags=integration -v ./...
        continue-on-error: true

      - name: Code quality check
        working-directory: Server/MuchToDo
        run: |
          go vet ./...
          go build ./...

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: Server/MuchToDo
        run: |
          docker build -t ${{ steps.meta.outputs.image_tag }} .
          docker tag ${{ steps.meta.outputs.image_tag }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Push to ECR
        run: |
          docker push ${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via rolling update on ASG
        run: |
          IMAGE_TAG="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          ASG_NAME="${{ secrets.ASG_NAME }}"

          # Get instance IDs from ASG
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[*].InstanceId' \
            --output text)

          echo "Deploying $IMAGE_TAG to instances: $INSTANCE_IDS"

          # Send deploy command to each instance via SSM
          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[
                'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}',
                'docker pull $IMAGE_TAG',
                'docker stop backend || true',
                'docker rm backend || true',
                'docker run -d --name backend --restart always -p 8080:8080 --env-file /etc/app/.env $IMAGE_TAG'
              ]" \
              --region ${{ env.AWS_REGION }}
          done

      - name: Run smoke test
        run: |
          sleep 30
          ALB_DNS="${{ secrets.ALB_DNS_NAME }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health)
          if [ "$STATUS" != "200" ]; then
            echo "ºç‚ùå Smoke test failed ‚Äî /health returned $STATUS"
            exit 1
          fi
          echo "‚úÖ Smoke test passed ‚Äî /health returned $STATUS"

      - name: Deployment summary
        run: |
          echo "‚úÖ Backend deployed successfully"
          echo "Ì ALB: http://${{ secrets.ALB_DNS_NAME }}"
